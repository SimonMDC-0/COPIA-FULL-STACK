<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesion - TWY</title>
    <meta name="description" content="Inicia sesion en The World Is Yours y accede a los territorios mas exclusivos del planeta.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header class="d-flex flex-wrap align-items-center justify-content-between py-2 px-4 mb-4 border-bottom sticky-top">

        <!-- Logo -->
        <div class="col-md-3 mb-2 mb-md-0 d-flex align-items-center gap-2">
            <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                <img src="../img/logo_twy.png" alt="Logo TWY" class="rounded-2" style="height:50px;width:auto;">
                <span class="fs-5 fw-bold text-success">The World<br>is Yours</span>
            </a>
        </div>

        <!-- Menu de navegacion -->
        <nav>
            <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
                <li><a href="../index.html" class="nav-link px-2">Home</a></li>
                <li><a href="productos.html" class="nav-link px-2">Productos</a></li>
                <li><a href="nosotros.html" class="nav-link px-2">Nosotros</a></li>
                <li><a href="blog.html" class="nav-link px-2">Blog</a></li>
                <li><a href="#" class="nav-link px-2">Contacto</a></li>
            </ul>
        </nav>

        <!-- Botones de sesion -->
        <div class="col-md-3 text-end">
            <a href="iniciarSesion.html" class="btn btn-outline-success me-2">Iniciar Sesion</a>
            <a href="registrarUsuario.html" class="btn btn-success">Registrar</a>
        </div>

    </header>

    <!-- CONTENIDO PRINCIPAL - FORMULARIO DE INICIO DE SESION -->
    <main class="py-5">
        <div class="container">
            <div class="register-container">

                <!-- Titulo del formulario -->
                <div class="form-banner">Iniciar Sesion</div>

                <form id="form-login" novalidate>

                    <!-- Campo correo -->
                    <div class="mb-4">
                        <label for="login-email" class="form-label-custom">Correo Electronico</label>
                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            class="form-control form-control-custom"
                            placeholder="usuario@ejemplo.com"
                            required
                            autocomplete="email">
                    </div>

                    <!-- Campo contrasena -->
                    <div class="mb-4">
                        <label for="login-password" class="form-label-custom">Contrasena</label>
                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            class="form-control form-control-custom"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password">
                    </div>

                    <!-- Recordarme y enlace olvidar contrasena -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="login-remember" name="remember">
                            <label class="form-check-label" for="login-remember" style="color:var(--color-muted);font-size:0.9rem;">
                                Recordarme
                            </label>
                        </div>
                        <a href="#" style="color:var(--color-primary);font-size:0.9rem;text-decoration:none;">
                            ¿Olvidaste tu contrasena?
                        </a>
                    </div>

                    <!-- Boton enviar -->
                    <div class="d-grid mb-3">
                        <button type="submit" id="btn-login" class="btn btn-register">Ingresar</button>
                    </div>

                    <!-- Enlace a registro -->
                    <p class="text-center" style="color:var(--color-muted);font-size:0.9rem;">
                        ¿No tienes cuenta?
                        <a href="registrarUsuario.html" style="color:var(--color-primary);text-decoration:none;">Registrate aqui</a>
                    </p>

                </form>

            </div>
        </div>
    </main>

    <!-- PIE DE PAGINA (FOOTER) -->
    <footer class="footer-outer" aria-label="Pie de pagina">
        <div class="container py-4">

            <!-- Navegacion del footer -->
            <nav aria-label="Navegacion del pie">
                <ul class="nav col-12 col-md-auto mb-3 justify-content-center">
                    <li><a href="../index.html" class="nav-link px-2">Home</a></li>
                    <li><a href="productos.html" class="nav-link px-2">Productos</a></li>
                    <li><a href="nosotros.html" class="nav-link px-2">Nosotros</a></li>
                    <li><a href="blog.html" class="nav-link px-2">Blog</a></li>
                    <li><a href="#" class="nav-link px-2">Contacto</a></li>
                </ul>
            </nav>

            <!-- Botones de sesion -->
            <div class="text-center mb-3">
                <a href="iniciarSesion.html" class="btn btn-outline-success me-2">Iniciar Sesion</a>
                <a href="registrarUsuario.html" class="btn btn-success">Registrar</a>
            </div>

            <!-- Copyright y boton candado oculto para admin -->
            <p class="text-center mb-0">
                &copy; 2026 The World Is Yours, Inc
                <a href="panelAdmin.html" class="admin-stealth-link"
                   title="Panel de Administracion" aria-label="Administracion">🔒</a>
            </p>

        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Validaciones TWY -->
    <script src="../js/validaciones.js"></script>
    <script>
        // Activar validacion en tiempo real del correo
        TWY.activarCampoEmail('login-email');

        // Validacion al enviar el formulario
        document.getElementById('form-login').addEventListener('submit', function (e) {
            e.preventDefault();
            const emailOk = TWY.validarEmail(document.getElementById('login-email').value);
            const passVal = document.getElementById('login-password').value;

            if (!emailOk) {
                TWY.mostrarError('login-email', 'Ingresa un correo valido.');
                return;
            }
            if (!passVal) {
                TWY.mostrarError('login-password', 'Ingresa tu contrasena.');
                return;
            }

            // Demo: redirige al panel admin tras 1.2 segundos
            document.getElementById('btn-login').textContent = 'Ingresando...';
            document.getElementById('btn-login').disabled = true;
            setTimeout(() => {
                window.location.href = 'panelAdmin.html';
            }, 1200);
        });
    </script>

</body>
</html>
